        .crt-screen::before {
            content: " ";

        /* SCREEN TEXT OUTPUT CONTAINER */
        .crt-text-output {

        .hidden { opacity: 0 !important; pointer-events: none !important; }
        .visible { opacity: 1 !important; pointer-events: auto !important; }

        /* INTERCONNECTING CORE CABLE */
        .hardware-wire {

        @keyframes dynamicCableStretch {
            0%, 100% { height: 40px; transform: scaleX(1); }

        /* CORE DASHBOARD MODULE */
        .inputter-deck {
            position: relative;

        /* Middle Section: Interactive Rotary Dial */
        .dial-knob-container {
            display: flex;

        /* Right Section: Launch Button */
        .action-button-bay {

        /* Ambient Audio Controller */

        }

</head>
<body>

<div class="space-backdrop">
    <div class="stars"></div>
</div>

<script>
// --- HIGH-DECIBEL WEBAUDIO SYNTHESIZER ENGINE ---
let audioCtx = null;
let isAudioPlaying = false;
let audioTimer = null;
let currentMode = 0;
let masterGain = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        
        // SET HIGH VOLUME LEVEL (0.6 is very loud for Web Audio synthesis)
        masterGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
    }
}

// Gravity Falls Melodic Sequence
const gfMelody = [
    { freq: 293.66, duration: 0.18 }, { freq: 349.23, duration: 0.18 }, { freq: 440.00, duration: 0.18 }, { freq: 523.25, duration: 0.18 },
    { freq: 440.00, duration: 0.18 }, { freq: 349.23, duration: 0.18 }, { freq: 293.66, duration: 0.18 }, { freq: 349.23, duration: 0.18 },
    { freq: 440.00, duration: 0.18 }, { freq: 523.25, duration: 0.18 }, { freq: 587.33, duration: 0.36 }, { freq: 523.25, duration: 0.36 }
];

let noteIdx = 0;

function playLoudMusicSequence() {
    if (!isAudioPlaying || !audioCtx) return;
    let time = audioCtx.currentTime;

    if (currentMode === 0) {
        // Mode 0: Loud Synthwave Synth
        const notes = [220.00, 261.63, 329.63, 392.00, 440.00];
        let note = notes[Math.floor(time * 3) % notes.length];
        
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(note, time);
        
        gain.gain.setValueAtTime(0.4, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
        
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(time);
        osc.stop(time + 0.35);

    } else if (currentMode === 1) {
        // Mode 1: Loud Chiptune Gravity Falls Theme
        let noteData = gfMelody[noteIdx % gfMelody.length];
        noteIdx++;

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(noteData.freq, time);

        gain.gain.setValueAtTime(0.5, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + noteData.duration);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(time);
        osc.stop(time + noteData.duration);

    } else if (currentMode === 2) {
        // Mode 2: Heavy Cyber Matrix Bassline
        const synthNotes = [110.00, 130.81, 146.83, 164.81];
        let note = synthNotes[Math.floor(time * 5) % synthNotes.length];

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(note, time);

        gain.gain.setValueAtTime(0.5, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.18);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(time);
        osc.stop(time + 0.2);

    } else if (currentMode === 3) {
        // Mode 3: Loud Siren Alarm Pulse
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, time);
        osc.frequency.exponentialRampToValueAtTime(880, time + 0.2);

        gain.gain.setValueAtTime(0.6, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.25);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(time);
        osc.stop(time + 0.28);
    }
}

function startLoudAudio() {
    initAudio();
    const btn = document.getElementById("audio-toggle-node");
    
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    isAudioPlaying = !isAudioPlaying;
    
    if (isAudioPlaying) {
        btn.textContent = "🔊 AUDIO: PLAYING (LOUD)";
        btn.style.background = "#00ffcc";
        btn.style.color = "#000000";
        btn.style.boxShadow = "0 0 20px #00ffcc";
        playLoudMusicSequence();
        clearInterval(audioTimer);
        audioTimer = setInterval(playLoudMusicSequence, 160);
    } else {
        btn.textContent = "🔊 CLICK HERE TO PLAY LOUD MUSIC";
        btn.style.background = "rgba(255, 0, 85, 0.8)";
        btn.style.color = "#ffffff";
        btn.style.boxShadow = "0 0 15px rgba(255, 0, 85, 0.6)";
        clearInterval(audioTimer);
    }
}

// Global user click event to ensure sound permissions are granted
document.body.addEventListener("click", () => {
    if (!isAudioPlaying) { startLoudAudio(); }
}, { once: true });

// --- VISUAL GRAPHICS ENGINE FOR MODES ---
let frameAngle = 0;
let isGlitching = false;

setInterval(() => {
    if (currentMode === 1) {
        isGlitching = true;
        setTimeout(() => { isGlitching = false; }, 800);
    }
}, 5000);

function getEggFrame(angle) {
    let frameLines = [];
    const width = 30, height = 13;
    for (let y = 0; y < height; y++) {
        let line = "";
        let normalizedY = (y / (height - 1)) * 2 - 1;
        let eggWidthFactor = Math.sqrt(1 - normalizedY * normalizedY) * (1.1 - 0.25 * normalizedY);
        let bound = Math.round(10 * eggWidthFactor);
        for (let x = 0; x < width; x++) {
            let distFromCenter = x - Math.round(width / 2);
            if (Math.abs(distFromCenter) <= bound && bound > 0) {
                let nx = distFromCenter / bound;
                let surfaceAngle = Math.asin(nx) + angle;
                let surfacePattern = Math.sin(surfaceAngle * 4.5) * Math.cos(normalizedY * 2);
                if (surfacePattern > 0.4) line += "M";
                else if (surfacePattern > 0.0) line += "#";
                else if (surfacePattern > -0.4) line += "=";
                else line += ".";
            } else {
                line += " ";
            }
        }
        frameLines.push(line);
    }
    return frameLines.join("\n");
}

function getPyramidFrame(angle) {
    if (isGlitching) {
        let glitchChars = "@#$%&*!?:;[]{}<>";
        let glitchStr = "";
        for (let i = 0; i < 12; i++) {
            for (let j = 0; j < 25; j++) {
                glitchStr += glitchChars[Math.floor(Math.random() * glitchChars.length)];
            }
            glitchStr += "\n";
        }
        return glitchStr;
    }

    let canvas = Array(12).fill("").map(() => Array(28).fill(" "));
    let cx = 14, cy = 6;
    let cosA = Math.cos(angle), sinA = Math.sin(angle);

    let nodes = [
        [0, -4, 0],
        [-5, 4, -4],
        [5, 4, -4],
        [0, 4, 5]
    ];

    let projected = nodes.map(node => {
        let x = node[0] * cosA - node[2] * sinA;
        let z = node[0] * sinA + node[2] * cosA;
        let y = node[1];
        return [Math.round(cx + x * 1.8), Math.round(cy + y)];
    });

    function drawLine(p1, p2, char) {
        let dx = Math.abs(p2[0] - p1[0]), dy = Math.abs(p2[1] - p1[1]);
        let sx = p1[0] < p2[0] ? 1 : -1, sy = p1[1] < p2[1] ? 1 : -1;
        let err = dx - dy, x = p1[0], y = p1[1];
        while (true) {
            if (y >= 0 && y < 12 && x >= 0 && x < 28) canvas[y][x] = char;
            if (x === p2[0] && y === p2[1]) break;
            let e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x += sx; }
            if (e2 < dx) { err += dx; y += sy; }
        }
    }

    drawLine(projected[0], projected[1], "▲");
    drawLine(projected[0], projected[2], "▲");
    drawLine(projected[0], projected[3], "▲");
    drawLine(projected[1], projected[2], "═");
    drawLine(projected[2], projected[3], "═");
    drawLine(projected[3], projected[1], "═");

    return canvas.map(row => row.join("")).join("\n");
}

function getMatrixFrame() {
    let chars = "010101010101XYZ789";
    let lines = [];
    for (let i = 0; i < 11; i++) {
        let line = "";
        for (let j = 0; j < 26; j++) {
            line += Math.random() > 0.6 ? chars[Math.floor(Math.random() * chars.length)] : " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getWarningFrame() {
    return "\n" +
           "  ⚠️ SYSTEM OVERDRIVE ⚠️ \n\n" +
           "  ======================\n" +
           "  CORE TEMP: EXCEEDED\n" +
           "  STATUS: CRITICAL\n" +
           "  ======================\n";
}

setInterval(() => {
    frameAngle += 0.12;
    const renderer = document.getElementById("ascii-renderer");

    if (currentMode === 0) {
        renderer.style.color = "#00ffcc";
        renderer.textContent = getEggFrame(frameAngle);
    } else if (currentMode === 1) {
        renderer.style.color = isGlitching ? "#ff0055" : "#ffff00";
        renderer.textContent = getPyramidFrame(frameAngle);
    } else if (currentMode === 2) {
        renderer.style.color = "#00ff66";
        renderer.textContent = getMatrixFrame();
    } else if (currentMode === 3) {
        renderer.style.color = "#ff3333";
        renderer.textContent = getWarningFrame();
    }
}, 100);

// --- ROTARY DIAL INTERACTION LOGIC ---
const dial = document.getElementById("rotary-dial");
let isDragging = false;
let startAngle = 0;
let currentRotation = 0;

function getAngle(e) {
    const rect = dial.getBoundingClientRect();
    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.atan2(clientY - center.y, clientX - center.x) * (180 / Math.PI);
}

dial.addEventListener("pointerdown", (e) => {
    isDragging = true;
    startAngle = getAngle(e) - currentRotation;
    dial.setPointerCapture(e.pointerId);
});

dial.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    currentRotation = getAngle(e) - startAngle;
    dial.style.transform = `rotate(${currentRotation}deg)`;

    let normalizedDegree = (currentRotation % 360 + 360) % 360;
    let newMode = Math.floor(normalizedDegree / 90);

    if (newMode !== currentMode) {
        currentMode = newMode;
        document.getElementById("mode-display-label").textContent = "MODE: " + currentMode;
    }
});

dial.addEventListener("pointerup", (e) => {
    isDragging = false;
});

// --- SCREEN CLICK INTERACTION ---
function handleScreenClick() {
    if (currentMode === 1) {
        window.location.href = "https://thisisnotawebsitedotcom.com";
