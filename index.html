// --- VISUAL GRAPHICS ENGINE FOR MODES ---

function getEggFrame(angle) {
    let frameLines = [];
    const width = 30, height = 13;
    for (let y = 0; y < height; y++) {
        let line = "";
        let normalizedY = (y / (height - 1)) * 2 - 1;
        let eggWidthFactor = Math.sqrt(1 - normalizedY * normalizedY) * (1.1 - 0.25 * normalizedY);
        let bound = Math.round(10 * eggWidthFactor);
        for (let x = 0; x < width; x++) {
            let distFromCenter = x - Math.round(width / 2);
            if (Math.abs(distFromCenter) <= bound && bound > 0) {
                let nx = distFromCenter / bound;
                let surfaceAngle = Math.asin(nx) + angle;
                let surfacePattern = Math.sin(surfaceAngle * 4.5) * Math.cos(normalizedY * 2);
                if (surfacePattern > 0.4) line += "M";
                else if (surfacePattern > 0.0) line += "#";
                else if (surfacePattern > -0.4) line += "=";
                else line += ".";
            } else {
                line += " ";
            }
        }
        frameLines.push(line);
    }
    return frameLines.join("\n");
}

function getPyramidFrame(angle) {
    if (isGlitching) {
        let glitchChars = "@#$%&*!?:;[]{}<>";
        let glitchStr = "";
        for (let i = 0; i < 12; i++) {
            for (let j = 0; j < 25; j++) {
                glitchStr += glitchChars[Math.floor(Math.random() * glitchChars.length)];
            }
            glitchStr += "\n";
        }
        return glitchStr;
    }

    let canvas = Array(12).fill("").map(() => Array(28).fill(" "));
    let cx = 14, cy = 6;
    let cosA = Math.cos(angle), sinA = Math.sin(angle);

    let nodes = [
        [0, -4, 0],
        [-5, 4, -4],
        [5, 4, -4],
        [0, 4, 5]
    ];

    let projected = nodes.map(node => {
        let x = node[0] * cosA - node[2] * sinA;
        let z = node[0] * sinA + node[2] * cosA;
        let y = node[1];
        return [Math.round(cx + x * 1.8), Math.round(cy + y)];
    });

    function drawLine(p1, p2, char) {
        let dx = Math.abs(p2[0] - p1[0]), dy = Math.abs(p2[1] - p1[1]);
        let sx = p1[0] < p2[0] ? 1 : -1, sy = p1[1] < p2[1] ? 1 : -1;
        let err = dx - dy, x = p1[0], y = p1[1];
        while (true) {
            if (y >= 0 && y < 12 && x >= 0 && x < 28) canvas[y][x] = char;
            if (x === p2[0] && y === p2[1]) break;
            let e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x += sx; }
            if (e2 < dx) { err += dx; y += sy; }
        }
    }

    drawLine(projected[0], projected[1], "▲");
    drawLine(projected[0], projected[2], "▲");
    drawLine(projected[0], projected[3], "▲");
    drawLine(projected[1], projected[2], "═");
    drawLine(projected[2], projected[3], "═");
    drawLine(projected[3], projected[1], "═");

    return canvas.map(row => row.join("")).join("\n");
}

function getMatrixFrame() {
    let chars = "010101010101XYZ789";
    let lines = [];
    for (let i = 0; i < 11; i++) {
        let line = "";
        for (let j = 0; j < 26; j++) {
            line += Math.random() > 0.6 ? chars[Math.floor(Math.random() * chars.length)] : " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

// --- ROTARY DIAL INTERACTION LOGIC ---
const dial = document.getElementById("rotary-dial");
let isDragging = false;
let startAngle = 0;
let currentRotation = 0;

function getAngle(e) {
    const rect = dial.getBoundingClientRect();
    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.atan2(clientY - center.y, clientX - center.x) * (180 / Math.PI);
}

dial.addEventListener("pointerdown", (e) => {
    isDragging = true;
    startAngle = getAngle(e) - currentRotation;
    dial.setPointerCapture(e.pointerId);
});

dial.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    currentRotation = getAngle(e) - startAngle;
    dial.style.transform = `rotate(${currentRotation}deg)`;

    let normalizedDegree = (currentRotation % 360 + 360) % 360;
    let newMode = Math.floor(normalizedDegree / 90);

        currentMode = newMode;
        document.getElementById("mode-display-label").textContent = "MODE: " + currentMode;

});

dial.addEventListener("pointerup", (e) => {

});

            break;
        case "clear":
            document.getElementById("screen-output").classList.add("hidden");
            document.getElementById("ascii-renderer").classList.remove("hidden");
            break;
        default:
            displayMessageOnScreen("S&P Code Invalid");
            break;
    }
    if (currentState !== "awaiting_jeorgie_interest") { inputField.value = ""; }
}
</script>
</body>
</html>
