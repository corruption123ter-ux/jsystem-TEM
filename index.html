            if (y >= 0 && y < 10 && x >= 0 && x < 24) canvas[y][x] = char;
            if (x === p2[0] && y === p2[1]) break;
            let e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x += sx; }
            if (e2 < dx) { err += dx; y += sy; }
        }
    }

    drawLine(projected[0], projected[1], "▲");
    drawLine(projected[0], projected[2], "▲");
    drawLine(projected[0], projected[3], "▲");
    drawLine(projected[1], projected[2], "═");
    drawLine(projected[2], projected[3], "═");
    drawLine(projected[3], projected[1], "═");

    return canvas.map(row => row.join("")).join("\n");
}

function getMatrixFrame() {
    let chars = "0101XYZ789";
    let lines = [];
    for (let i = 0; i < 10; i++) {
        let line = "";
        for (let j = 0; j < 24; j++) {
            line += Math.random() > 0.6 ? chars[Math.floor(Math.random() * chars.length)] : " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getWarningFrame() {
    return "  ⚠️ OVERDRIVE ⚠️ \n\n" +
           "  =================\n" +
           "  TEMP: EXCEEDED\n" +
           "  STATUS: CRITICAL\n" +
           "  =================\n";
}

function getNebulaFrame(angle) {
    let lines = [];
    for (let y = 0; y < 10; y++) {
        let line = "";
        for (let x = 0; x < 24; x++) {
            let dx = x - 12, dy = y - 5;
            let dist = Math.sqrt(dx * dx + dy * dy * 2);
            let val = Math.sin(dist - angle * 2);
            if (val > 0.6) line += "★";
            else if (val > 0.2) line += "*";
            else if (val > -0.3) line += ".";
            else line += " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getGridFrame(angle) {
    let lines = [];
    for (let y = 0; y < 10; y++) {
        let line = "";
        for (let x = 0; x < 24; x++) {
            if (y === 9 || y === 7 || y === 4) line += "═";
            else if (x % 4 === 0 && y > 3) line += "║";
            else line += " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getCoreFrame(angle) {
    let pulse = Math.sin(angle * 3) > 0;
    return "\n" +
           "  .---.---.---.  \n" +
           ` | ${pulse ? "⚛" : " "} CORE ${pulse ? "⚛" : " "} | \n` +
           "  '---'---'---'  \n" +
           `  OUTPUT: ${pulse ? "100%" : "50%"}  \n`;
}

function getQuantumFrame() {

const dial = document.getElementById("rotary-dial");
let isDragging = false;
let startAngle = 0;
let currentRotation = 0;

function getAngle(e) {
    const rect = dial.getBoundingClientRect();
    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.atan2(clientY - center.y, clientX - center.x) * (180 / Math.PI);
}

dial.addEventListener("pointerdown", (e) => {
    isDragging = true;
    startAngle = getAngle(e) - currentRotation;
    dial.setPointerCapture(e.pointerId);
});

dial.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    currentRotation = getAngle(e) - startAngle;
    dial.style.transform = `rotate(${currentRotation}deg)`;

    let normalizedDegree = (currentRotation % 360 + 360) % 360;
    let newMode = Math.floor(normalizedDegree / (360 / 8)) + 1;

    if (newMode !== currentMode) {
        currentMode = newMode;
        document.getElementById("mode-display-label").textContent = "MODE: " + currentMode;
        syncAudioToMode();
    }
});

dial.addEventListener("pointerup", (e) => {
    isDragging = false;
});

function handleScreenClick() {
    if (currentMode === 2) {
        window.location.href = "https://thisisnotawebsitedotcom.com";
    }
}

document.getElementById("code-input").addEventListener("keypress", function(event) {

});

function displayMessageOnScreen(messageHTML, holdTime = 0) {
    const asciiElement = document.getElementById("ascii-renderer");
    const screenOutput = document.getElementById("screen-output");

    screenOutput.innerHTML = messageHTML;
    asciiElement.classList.add("hidden");
    screenOutput.classList.remove("hidden");
    screenOutput.classList.add("visible");

    if (holdTime > 0) {
        setTimeout(() => {
            screenOutput.classList.add("hidden");
            screenOutput.classList.remove("visible");
            setTimeout(() => {
                asciiElement.classList.remove("hidden");
            }, 800);
        }, holdTime);
    }
}
