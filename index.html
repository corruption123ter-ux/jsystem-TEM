<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSYSTEM.CO // TERMINAL INTERCEPT</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            background-color: #030306;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }

        .space-backdrop {
            position: absolute;
            width: 100%;
            height: 200%;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 15% 15%, #ffffff, transparent),
                radial-gradient(2px 2px at 45% 55%, #00ffcc, transparent),
                radial-gradient(1px 1px at 75% 25%, #ffffff, transparent),
                radial-gradient(2.5px 2.5px at 85% 75%, #00bfff, transparent),
                radial-gradient(1.5px 1.5px at 25% 85%, rgba(255,255,255,0.4), transparent),
                radial-gradient(3px 3px at 55% 15%, #ffffff, transparent),
                radial-gradient(1px 1px at 90% 40%, #00ffcc, transparent);
            background-size: 100% 50%;
            z-index: 1;
            opacity: 0.8;
            animation: vectorSpaceWarp 18s linear infinite;
        }
        @keyframes vectorSpaceWarp {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); }
        }

        .jsystem-monitor {
            position: relative;
            z-index: 10;
            width: min(90vw, 420px);
            height: min(42vh, 320px);
            background: linear-gradient(145deg, #181a24 0%, #0f1016 100%);
            border: 2px solid rgba(0, 191, 255, 0.25);
            border-radius: 16px;
            padding: min(5vh, 35px) 20px 20px 20px;
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.8), 
                0 0 30px rgba(0, 191, 255, 0.1),
                inset 0 1px 2px rgba(255,255,255,0.05);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: smoothEngineFloat 8s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        @keyframes smoothEngineFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-1vh) rotate(0.3deg); }
        }

        .brand-header {
            position: absolute;
            top: min(1.5vh, 12px);
            left: 50%;
            transform: translateX(-50%);
            color: #00bfff;
            font-size: min(2.5vh, 12px);
            font-weight: 800;
            letter-spacing: 4px;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.4);
        }

        .bracket {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: rgba(0, 255, 204, 0.4);
            border-style: solid;
            pointer-events: none;
        }
        .tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .tr { top: 10px; right: 10px; border-width: 2px 0 0 2px; transform: rotate(90deg); }
        .bl { bottom: 10px; left: 10px; border-width: 2px 0 0 2px; transform: rotate(-90deg); }
        .br { bottom: 10px; right: 10px; border-width: 2px 0 0 2px; transform: rotate(180deg); }

        .crt-screen-container {
            background-color: #050608;
            border: 2px solid #1c1e26;
            border-radius: 12px;
            padding: 8px;
            box-shadow: inset 0 0 30px rgba(0,0,0,1), 0 0 15px rgba(0, 255, 204, 0.05);
            overflow: hidden;
            height: 100%;
            display: flex;
        }
        .crt-screen {
            background: radial-gradient(circle at center, #051412 0%, #010304 100%);
            border-radius: 8px;
            padding: 5px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 5;
            background-size: 100% 3px;
            pointer-events: none;
            opacity: 0.6;
        }

        .ascii-matrix {
            font-size: min(1.8vh, 2.5vw, 10px);
            line-height: 1;
            white-space: pre;
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
            position: absolute;
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
            z-index: 2;
            text-align: center;
            user-select: none;
        }

        .crt-text-output {
            position: absolute;
            width: 90%;
            font-size: min(1.8vh, 2.8vw, 11px);
            color: #33ff77;
            text-shadow: 0 0 6px rgba(0, 255, 100, 0.6);
            line-height: 1.3;
            text-align: center;
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            z-index: 3;
            pointer-events: auto;
            word-wrap: break-word;
        }

        .hidden { opacity: 0 !important; pointer-events: none !important; }
        .visible { opacity: 1 !important; pointer-events: auto !important; }

        .hardware-wire {
            width: min(1.5vw, 8px);
            height: min(4vh, 30px);
            background: linear-gradient(90deg, #090a0f 0%, #202430 50%, #090a0f 100%);
            border-left: 1px solid rgba(0, 191, 255, 0.15);
            border-right: 1px solid rgba(0, 191, 255, 0.15);
            z-index: 5;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            animation: dynamicCableStretch 8s ease-in-out infinite;
        }
        @keyframes dynamicCableStretch {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.2); }
        }

        .inputter-deck {
            position: relative;
            z-index: 10;
            width: min(94vw, 460px);
            height: min(20vh, 120px);
            background: linear-gradient(145deg, #111218 0%, #171922 100%);
            border: 2px solid rgba(0, 255, 204, 0.2);
            border-radius: 14px;
            padding: min(2vh, 15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 
                0 20px 45px rgba(0,0,0,0.8),
                0 0 25px rgba(0, 255, 204, 0.05),
                inset 0 1px 2px rgba(255,255,255,0.03);
            animation: smoothConsoleFloat 8s ease-in-out infinite;
            animation-delay: -4s;
        }
        @keyframes smoothConsoleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-0.5vh) rotate(-0.2deg); }
        }

        .status-display-bay {
            flex: 1;
            height: 100%;
            background-color: #030a07;
            border: 1px solid rgba(0, 255, 100, 0.25);
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input {
            background-color: #010403;
            color: #00ff66;
            border: 1px solid rgba(0, 255, 100, 0.4);
            padding: min(1.2vh, 8px);
            font-size: min(1.8vh, 2.5vw, 12px);
            font-family: inherit;
            outline: none;
            width: 100%;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 0 0 4px rgba(0, 255, 100, 0.4);
        }
        input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3), inset 0 0 5px rgba(0,0,0,0.8);
        }

        .dial-knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(20vw, 75px);
            height: 100%;
        }
        .dial-label {
            font-size: min(1.4vh, 2vw, 9px);
            color: #00ffcc;
            margin-bottom: 4px;
            letter-spacing: 1px;
            font-weight: bold;
            white-space: nowrap;
        }
        .dial-knob {
            width: min(10vh, 12vw, 50px);
            height: min(10vh, 12vw, 50px);
            background: radial-gradient(circle, #3a3e4f 0%, #1c1e26 100%);
            border: 2px solid #00ffcc;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 8px rgba(0,255,204,0.2);
            cursor: grab;
            touch-action: none;
        }
        .dial-knob:active {
            cursor: grabbing;
        }
        .dial-pointer-notch {
            position: absolute;
            width: 3px;
            height: 25%;
            background-color: #00ffcc;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 6px #00ffcc;
            pointer-events: none;
        }

        .action-button-bay {
            width: min(22vw, 85px);
            height: 100%;
            background: #0d0e12;
            border: 2px solid #202430;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.9);
            padding: 4px;
        }
        .red-launch-btn {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ff3b3b 0%, #aa0000 100%);
            border: 1px solid #550000;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0px #400000, 0 5px 10px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .red-launch-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #400000, 0 2px 4px rgba(0,0,0,0.6);
        }
        .red-launch-btn-label {
            color: #ffffff;
            font-size: min(1.6vh, 2.2vw, 10px);
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 -1px 2px rgba(0,0,0,0.7);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .audio-deck-control {
            position: absolute;
            top: max(1vh, 10px);
            left: max(1vw, 10px);
            z-index: 100;
        }
        .mute-toggle-btn {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: min(1vh, 6px) min(2vw, 12px);
            font-size: min(1.5vh, 2.2vw, 10px);
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }
        .mute-toggle-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
</head>
<body>

<div class="space-backdrop">
    <div class="stars"></div>
</div>

<div class="audio-deck-control">
    <button class="mute-toggle-btn" id="audio-toggle-node" onclick="toggleAudioSystem()">🔊 AUDIO SYSTEM: READY (CLICK TO START)</button>
</div>

<div class="jsystem-monitor">
    <div class="brand-header">JSYSTEM.CO</div>
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="crt-screen-container">
        <div class="crt-screen" id="crt-screen-trigger" onclick="handleScreenClick()">
            <div class="ascii-matrix" id="ascii-renderer"></div>
            <div class="crt-text-output hidden" id="screen-output"></div>
        </div>
    </div>
</div>

<div class="hardware-wire"></div>

<div class="inputter-deck">
    <div class="status-display-bay">
        <input type="text" id="code-input" placeholder="Awaiting code..." autocomplete="off">
    </div>

    <div class="dial-knob-container">
        <div class="dial-label" id="mode-display-label">MODE: 1</div>
        <div class="dial-knob" id="rotary-dial">
            <div class="dial-pointer-notch"></div>
        </div>
    </div>

    <div class="action-button-bay">
        <button class="red-launch-btn" onclick="checkCode()">
            <span class="red-launch-btn-label">EXECUTE</span>
        </button>
    </div>
</div>

<script>
// --- WEB AUDIO API SYNTHESIZER ---
let audioCtx = null;
let isAudioEnabled = false;
let audioLoopInterval = null;
let currentMode = 1;

function initAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playNote(freq, type = 'sawtooth', duration = 0.2, volume = 0.1) {
    if (!audioCtx || !isAudioEnabled) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {
        console.log(e);
    }
}

function stopAllAudio() {
    if (audioLoopInterval) {
        clearInterval(audioLoopInterval);
        audioLoopInterval = null;
    }
}

function syncAudioToMode() {
    stopAllAudio();
    if (!isAudioEnabled) return;

    if (currentMode === 1) {
        const terminalNotes = [440, 880, 554.37, 659.25, 783.99, 1046.50];
        let idx = 0;
        audioLoopInterval = setInterval(() => {
            playNote(terminalNotes[idx], 'sine', 0.1, 0.08);
            idx = (idx + 1) % terminalNotes.length;
        }, 200);
    } else if (currentMode === 2) {
        const gfMelody = [
            { f: 440.00, d: 0.18 }, { f: 523.25, d: 0.18 }, { f: 659.25, d: 0.18 }, { f: 523.25, d: 0.18 },
            { f: 440.00, d: 0.18 }, { f: 523.25, d: 0.18 }, { f: 659.25, d: 0.18 }, { f: 523.25, d: 0.18 },
            { f: 349.23, d: 0.18 }, { f: 440.00, d: 0.18 }, { f: 523.25, d: 0.18 }, { f: 440.00, d: 0.18 },
            { f: 329.63, d: 0.18 }, { f: 415.30, d: 0.18 }, { f: 523.25, d: 0.18 }, { f: 415.30, d: 0.18 }
        ];
        let idx = 0;
        audioLoopInterval = setInterval(() => {
            let note = gfMelody[idx];
            playNote(note.f, 'sawtooth', note.d, 0.12);
            idx = (idx + 1) % gfMelody.length;
        }, 180);
    } else if (currentMode === 3) {
        audioLoopInterval = setInterval(() => {
            let randomFreq = Math.floor(Math.random() * 800) + 200;
            playNote(randomFreq, 'square', 0.08, 0.05);
        }, 100);
    } else if (currentMode === 4) {
        let toggle = false;
        audioLoopInterval = setInterval(() => {
            playNote(toggle ? 880 : 440, 'sawtooth', 0.2, 0.15);
            toggle = !toggle;
        }, 250);
    } else if (currentMode === 5) {
        const spaceNotes = [110, 164.81, 220, 329.63];
        let idx = 0;
        audioLoopInterval = setInterval(() => {
            playNote(spaceNotes[idx], 'sine', 0.6, 0.18);
            idx = (idx + 1) % spaceNotes.length;
        }, 400);
    } else if (currentMode === 6) {
        const bassLine = [65.41, 65.41, 82.41, 98.00];
        let idx = 0;
        audioLoopInterval = setInterval(() => {
            playNote(bassLine[idx], 'sawtooth', 0.15, 0.15);
            idx = (idx + 1) % bassLine.length;
        }, 160);
    } else if (currentMode === 7) {
        audioLoopInterval = setInterval(() => {
            playNote(60, 'square', 0.3, 0.2);
        }, 500);
    } else if (currentMode === 8) {
        audioLoopInterval = setInterval(() => {
            playNote(1200 + Math.random() * 800, 'sawtooth', 0.04, 0.06);
        }, 60);
    }
}

function toggleAudioSystem() {
    initAudioContext();
    isAudioEnabled = !isAudioEnabled;
    const btn = document.getElementById("audio-toggle-node");
    
    if (isAudioEnabled) {
        btn.textContent = "🔊 AUDIO SYSTEM: ACTIVE";
        btn.style.background = "#00ffcc";
        btn.style.color = "#000000";
        syncAudioToMode();
    } else {
        btn.textContent = "🔈 AUDIO SYSTEM: MUTED";
        btn.style.background = "rgba(255, 0, 85, 0.3)";
        btn.style.color = "#ff0055";
        stopAllAudio();
    }
}

document.body.addEventListener("click", () => {
    if (!isAudioEnabled) { toggleAudioSystem(); }
}, { once: true });

// --- VISUAL GRAPHICS ENGINE (MODES 1 - 8) ---
let frameAngle = 0;
let isGlitching = false;

setInterval(() => {
    if (currentMode === 2) {
        isGlitching = true;
        setTimeout(() => { isGlitching = false; }, 800);
    }
}, 5000);

function getEggFrame(angle) {
    let frameLines = [];
    const width = 22, height = 9;
    for (let y = 0; y < height; y++) {
        let line = "";
        let normalizedY = (y / (height - 1)) * 2 - 1;
        let eggWidthFactor = Math.sqrt(1 - normalizedY * normalizedY) * (1.1 - 0.25 * normalizedY);
        let bound = Math.round(7 * eggWidthFactor);
        for (let x = 0; x < width; x++) {
            let distFromCenter = x - Math.round(width / 2);
            if (Math.abs(distFromCenter) <= bound && bound > 0) {
                let nx = distFromCenter / bound;
                let surfaceAngle = Math.asin(nx) + angle;
                let surfacePattern = Math.sin(surfaceAngle * 4.5) * Math.cos(normalizedY * 2);
                if (surfacePattern > 0.4) line += "M";
                else if (surfacePattern > 0.0) line += "#";
                else if (surfacePattern > -0.4) line += "=";
                else line += ".";
            } else {
                line += " ";
            }
        }
        frameLines.push(line);
    }
    return frameLines.join("\n");
}

function getPyramidFrame(angle) {
    if (isGlitching) {
        let glitchChars = "@#$%&*!?:;[]{}<>";
        let glitchStr = "";
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 22; j++) {
                glitchStr += glitchChars[Math.floor(Math.random() * glitchChars.length)];
            }
            glitchStr += "\n";
        }
        return glitchStr;
    }

    let canvas = Array(9).fill("").map(() => Array(22).fill(" "));
    let cx = 11, cy = 4;
    let cosA = Math.cos(angle), sinA = Math.sin(angle);

    let nodes = [
        [0, -3, 0],
        [-3.5, 3, -2.5],
        [3.5, 3, -2.5],
        [0, 3, 3]
    ];

    let projected = nodes.map(node => {
        let x = node[0] * cosA - node[2] * sinA;
        let z = node[0] * sinA + node[2] * cosA;
        let y = node[1];
        return [Math.round(cx + x * 1.3), Math.round(cy + y)];
    });

    function drawLine(p1, p2, char) {
        let dx = Math.abs(p2[0] - p1[0]), dy = Math.abs(p2[1] - p1[1]);
        let sx = p1[0] < p2[0] ? 1 : -1, sy = p1[1] < p2[1] ? 1 : -1;
        let err = dx - dy, x = p1[0], y = p1[1];
        while (true) {
            if (y >= 0 && y < 9 && x >= 0 && x < 22) canvas[y][x] = char;
            if (x === p2[0] && y === p2[1]) break;
            let e2 = 2 * err;
            if (e2 > -dy) { err -= dy; x += sx; }
            if (e2 < dx) { err += dx; y += sy; }
        }
    }

    drawLine(projected[0], projected[1], "▲");
    drawLine(projected[0], projected[2], "▲");
    drawLine(projected[0], projected[3], "▲");
    drawLine(projected[1], projected[2], "═");
    drawLine(projected[2], projected[3], "═");
    drawLine(projected[3], projected[1], "═");

    return canvas.map(row => row.join("")).join("\n");
}

function getMatrixFrame() {
    let chars = "0101XYZ789";
    let lines = [];
    for (let i = 0; i < 9; i++) {
        let line = "";
        for (let j = 0; j < 22; j++) {
            line += Math.random() > 0.6 ? chars[Math.floor(Math.random() * chars.length)] : " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getWarningFrame() {
    return "  ⚠️ OVERDRIVE ⚠️ \n\n" +
           "  ===============\n" +
           "  TEMP: EXCEEDED\n" +
           "  STATUS: CRITICAL\n" +
           "  ===============\n";
}

function getNebulaFrame(angle) {
    let lines = [];
    for (let y = 0; y < 9; y++) {
        let line = "";
        for (let x = 0; x < 22; x++) {
            let dx = x - 11, dy = y - 4;
            let dist = Math.sqrt(dx * dx + dy * dy * 2);
            let val = Math.sin(dist - angle * 2);
            if (val > 0.6) line += "★";
            else if (val > 0.2) line += "*";
            else if (val > -0.3) line += ".";
            else line += " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getGridFrame(angle) {
    let lines = [];
    for (let y = 0; y < 9; y++) {
        let line = "";
        for (let x = 0; x < 22; x++) {
            if (y === 8 || y === 6 || y === 4) line += "═";
            else if (x % 4 === 0 && y > 3) line += "║";
            else line += " ";
        }
        lines.push(line);
    }
    return lines.join("\n");
}

function getCoreFrame(angle) {
    let pulse = Math.sin(angle * 3) > 0;
    return "\n" +
           "  .---.---.---.  \n" +
           ` | ${pulse ? "⚛" : " "} CORE ${pulse ? "⚛" : " "} | \n` +
           "  '---'---'---'  \n" +
           `  OUTPUT: ${pulse ? "100%" : "50%"}  \n`;
}

function getQuantumFrame() {
    let chars = "░▒▓█<>/\\#$";
    let lines = [];
    for (let i = 0; i < 9; i++) {
        let line = "";
        for (let j = 0; j < 22; j++) {
            line += chars[Math.floor(Math.random() * chars.length)];
        }
        lines.push(line);
    }
    return lines.join("\n");
}

setInterval(() => {
    frameAngle += 0.12;
    const renderer = document.getElementById("ascii-renderer");

    switch(currentMode) {
        case 1:
            renderer.style.color = "#00ffcc";
            renderer.textContent = getEggFrame(frameAngle);
            break;

// --- ROTARY DIAL LOGIC ---
const dial = document.getElementById("rotary-dial");
let isDragging = false;
let startAngle = 0;
let currentRotation = 0;

function getAngle(e) {
    const rect = dial.getBoundingClientRect();
    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.atan2(clientY - center.y, clientX - center.x) * (180 / Math.PI);
}

dial.addEventListener("pointerdown", (e) => {
    isDragging = true;
    startAngle = getAngle(e) - currentRotation;
    dial.setPointerCapture(e.pointerId);
});

dial.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    currentRotation = getAngle(e) - startAngle;
    dial.style.transform = `rotate(${currentRotation}deg)`;

    let normalizedDegree = (currentRotation % 360 + 360) % 360;
    let newMode = Math.floor(normalizedDegree / (360 / 8)) + 1;

    if (newMode !== currentMode) {
        currentMode = newMode;
        document.getElementById("mode-display-label").textContent = "MODE: " + currentMode;
        syncAudioToMode();
    }
});

dial.addEventListener("pointerup", (e) => {
    isDragging = false;
});
