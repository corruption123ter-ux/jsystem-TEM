<script>
// --- NOSTALGIC SYNTHESIZER AUDIO GENERATOR ---
let audioCtx = null;
let isAudioPlaying = false;
let audioTimer = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playNostalgicArpeggio() {
    if (!isAudioPlaying || !audioCtx) return;
    
    // Nostalgic synth-wave chord progressions (Hz)
    const notes = [
        [220.00, 261.63, 329.63, 392.00], // A minor 7
        [174.61, 220.00, 261.63, 329.63], // F major 7
        [130.81, 164.81, 196.00, 246.94], // C major 7
        [146.83, 174.61, 220.00, 261.63]  // D minor 7
    ];
    
    let time = audioCtx.currentTime;
    let chordIdx = Math.floor(time / 2) % notes.length;
    let chord = notes[chordIdx];
    
    // Create soft nostalgic triangle waves
    chord.forEach((freq, i) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);
        
        // Soft ambient envelope
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.03, time + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 1.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(time + (i * 0.15));
        osc.stop(time + 2.0);
    });
}

function toggleAudio() {
    initAudio();
    const btn = document.getElementById("audio-toggle-node");
    
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    isAudioPlaying = !isAudioPlaying;
    
    if (isAudioPlaying) {
        btn.textContent = "🔊 AUDIO: ON";
        btn.style.color = "#00ffcc";
        playNostalgicArpeggio();
        audioTimer = setInterval(playNostalgicArpeggio, 1600);
    } else {
        btn.textContent = "🎵 AUDIO: OFF";
        btn.style.color = "#ff4500";
        clearInterval(audioTimer);
    }
}

// Auto-start sound on user's first interaction anywhere on screen
document.body.addEventListener("click", () => {
    if (!isAudioPlaying) {

}, { once: true });

// --- 3D PERSPECTIVE CALCULATIONS FOR HIGH-DEFINITION SLOW SPINNING SPACE EGG ---
const eggFrames = [];
const numFrames = 24;
const width = 30, height = 13;

for (let f = 0; f < numFrames; f++) {
    let frameLines = [];
    let angle = (f / numFrames) * Math.PI * 2;
    for (let y = 0; y < height; y++) {
        let line = "";
        let normalizedY = (y / (height - 1)) * 2 - 1;
        let eggWidthFactor = Math.sqrt(1 - normalizedY * normalizedY) * (1.1 - 0.25 * normalizedY);
        let bound = Math.round(10 * eggWidthFactor);
        for (let x = 0; x < width; x++) {
            let centerX = Math.round(width / 2);
            let distFromCenter = x - centerX;
            if (Math.abs(distFromCenter) <= bound && bound > 0) {
                let nx = distFromCenter / bound;
                let surfaceAngle = Math.asin(nx) + angle;
                let surfacePattern = Math.sin(surfaceAngle * 4.5) * Math.cos(normalizedY * 2);
                if (surfacePattern > 0.4) line += "M";
                else if (surfacePattern > 0.0) line += "#";
                else if (surfacePattern > -0.4) line += "=";
                else line += ".";
            } else {
                line += " ";
            }
        }
        frameLines.push(line);
    }
    eggFrames.push(frameLines.join("\n"));
}

let currentFrameIdx = 0;
setInterval(() => {
    document.getElementById("egg-renderer").textContent = eggFrames[currentFrameIdx];
    currentFrameIdx = (currentFrameIdx + 1) % numFrames;
}, 120);

// --- SCREEN FADE DISPLAY LOGIC ---
let fadeTimeout = null;

function displayMessageOnScreen(messageHTML) {
    const eggElement = document.getElementById("egg-renderer");

    eggElement.classList.remove("visible");
    screenOutput.classList.remove("hidden");
    screenOutput.classList.add("visible");

    // Hold message for 10 seconds, then fade back into spinning egg
    fadeTimeout = setTimeout(() => {
        screenOutput.classList.add("hidden");
        screenOutput.classList.remove("visible");
        eggElement.classList.remove("hidden");
        eggElement.classList.add("visible");

}

// --- SECURE SECURITY LOG MATCH PASSWORD AUTOMATION REGISTRY ---
let currentState = "idle";
document.getElementById("code-input").addEventListener("keypress", function(event) {

    switch (input) {

            currentState = "awaiting_jeorgie_interest";

        case "egg":
